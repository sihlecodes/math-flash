<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flash Cards</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex/dist/katex.min.css">
  <link rel="stylesheet" href="shared/variables.css">
  <link rel="stylesheet" href="shared/main.css">

  <script defer src="https://cdn.jsdelivr.net/npm/katex/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex/dist/contrib/auto-render.min.js"></script>
  <script defer src="shared/main.js"></script>

  <style>
    @media screen {
      .container {
        margin: 0 auto;
        height: auto;
      }
      .card {
        height: calc((var(--page-height) - var(--margin-top) - var(--margin-bottom))/4);
      }
    }
  </style>
</head>
<body>
  <%_ pages.forEach(function(metadata) { _%>
  <div class="container">
  <%_ for (let i = 0; i < metadata.length; i++) { _%>
  <%- include('cards/front', metadata[i]) _%>
  <%- include('cards/back', metadata[i]) _%>
  <%_ } _%>
  </div>
  <%_ }); _%>
</body>
</html>
